version: '3'
services:
  app:
    build: .
    volumes:
      - ..:/workspaces/lang_chain
    ports:
      - "8000:8000"
    depends_on:
      - db
  db:
    image: postgres:13
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
