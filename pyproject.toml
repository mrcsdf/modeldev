[project]
name = "modeldev"
version = "0.1.0"
description = "A Python project for model development"
authors = [
    {name = "mrcsdf",email = "mdfern@outlook.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core dependencies will be added here
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-cov = "^4.1.0"
pytest-xdist = "^3.6.0"
black = "^24.8.0"
isort = "^5.13.2"
mypy = "^1.10.0"
pylint = "^3.2.7"
bandit = "^1.7.7"
flake8 = "^7.1.0"
pre-commit = "^3.8.0"
detect-secrets = "^1.5.0"
types-PyYAML = "^6.0.12.20240808"
types-requests = "^2.31.0.20240218"
types-psutil = "^5.9.5.20240316"

[tools.poetry]
packages = [{ include = "modelDev", from = "src"}]

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$' 
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
force_grid_wrap = 0
combine_as_imports = true
include_trailing_comma = true

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
allow_redefinition = true
files = ["src", "tests"]
exclude = ["build", "dist"]

[tool.pytest.ini_options]
addopts = "-v -ra --strict-markers --strict-config --cov=src --cov-report=term-missing --cov-report=html --cov-report=xml"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/.venv/*",
    "*/env/*",
    "*/.env/*",
    "setup.py",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/.*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101", "B601", "B110", "B404"]
severity = "medium"

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503", "E501"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    ".eggs",
    "*.egg",
]
per-file-ignores = [
    "__init__.py:F401",
    "tests/*:S101,S602"
]

